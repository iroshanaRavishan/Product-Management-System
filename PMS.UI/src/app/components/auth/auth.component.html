<div class="container">
    <div class="auth-container">
        <form class="form">
          <h2>Register</h2>
          <div class="form-group">
            <label for="email">Email</label> <input type="email" id="email">
          </div>
          <div class="form-group">
            <label for="password">Password</label> <input type="password" id="password">
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label> <input type="password" id="confirmPassword">
          </div>
          <button type="submit" >Register</button>
        </form>
      </div>
      <div class="auth-container">
        <form class="form" [formGroup]="authForm">
          <h2>Login</h2>
          <div *ngIf="error" class="error-message">{{ error }}</div>
          <div class="form-group">
            <label for="email">Email</label> <input type="email" id="email" formControlName="email">
          </div>
          <div class="form-group">
            <label for="password">Password</label> <input type="password" id="password" formControlName="password">
          </div>
          <button type="button" (click)="onSubmit()">Login</button>
          <div *ngIf="isLoading" class="loading-spinner"></div>
        </form>
      </div>
</div>
