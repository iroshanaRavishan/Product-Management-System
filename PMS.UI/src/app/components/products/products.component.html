<div class="container">
  <br><h1>Products</h1><br>
  <table class="table" *ngIf="products && products.length > 0">
      <thead>
        <tr>
          <th scope="col">
              <div class="inner-button">
                <label>Name</label>
                <div (click)="sort('name')" class="sorting-button">
                  <mat-icon class="arrow" [ngClass]="{'active-arrow': sortDirection == 'asc' && sortBy =='name' }">arrow_drop_up</mat-icon>
                  <mat-icon class="arrow" [ngClass]="{'active-arrow': sortDirection == 'desc' && sortBy =='name' }"> arrow_drop_down </mat-icon>
                </div>
              </div>
          </th>
          <th scope="col">
              <div class="inner-button">
                <label>Type</label>
                <div (click)="sort('type')" class="sorting-button">
                  <mat-icon class="arrow" [ngClass]="{'active-arrow': sortDirection == 'asc' && sortBy =='type' }">arrow_drop_up</mat-icon>
                  <mat-icon class="arrow" [ngClass]="{'active-arrow': sortDirection == 'desc' && sortBy =='type'  }"> arrow_drop_down </mat-icon>
                </div>
              </div>
          </th>
          <th scope="col">
            <div class="inner-button">
              <label>Color</label>
              <div (click)="sort('color')" class="sorting-button">
                <mat-icon class="arrow" [ngClass]="{'active-arrow': sortDirection == 'asc' && sortBy =='color' }">arrow_drop_up</mat-icon>
                <mat-icon class="arrow" [ngClass]="{'active-arrow': sortDirection == 'desc' && sortBy =='color'  }"> arrow_drop_down </mat-icon>
              </div>
            </div>
        </th>
          <th scope="col">
              <div class="inner-button">
                <label>Price</label>
                <div (click)="sort('price')" class="sorting-button">
                  <mat-icon class="arrow" [ngClass]="{'active-arrow': sortDirection == 'asc' && sortBy =='price' }">arrow_drop_up</mat-icon>
                  <mat-icon class="arrow" [ngClass]="{'active-arrow': sortDirection == 'desc' && sortBy =='price'  }"> arrow_drop_down </mat-icon>
                </div>
              </div>
          </th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of paginatedData; index as i">
          <td>{{i+1}}. {{item.name}}</td>
          <td>{{item.type}}</td>
          <td>{{item.color}}</td>
          <td>{{item.price | currency: 'LKR '}}</td>
          <td class="btn-group" role="group">
            <button type="button" class="btn btn-secondary rounded-left" (click)="editProduct(item)"><mat-icon class="action-btn">edit_note</mat-icon></button>
            <button type="button" class="btn btn-danger rounded-right" (click)="deleteProduct(item)"><mat-icon class="action-btn">delete</mat-icon></button>
          </td>
        </tr>
      </tbody>
    </table>
    <p *ngIf="!products || products.length == 0">No Product Found...!</p>
</div>

<div *ngIf="isLoading" class="spinner"></div>

<div *ngIf="products.length && !isLoading">
  <div class="d-flex justify-content-center align-items-center ">
    <div class="pagination">
      <div class="page-sizing d-flex justify-content-center">
        <label for="pageSize" class="me-2">Items per page:</label>
        <div class="dropdown">
          <div class="select" (click)="toggleDropdown()">
            <span class="selected">{{ selectedPageSize }}</span>
            <div class="caret"></div>
          </div>
          <ul class="menu" [ngClass]="{ 'show': showMenu }">
            <li *ngFor="let size of [5, 10, 15, 20]" (click)="selectPageSize(size)" [ngClass]="{ 'active': size === selectedPageSize }">
              {{ size }}
            </li>
          </ul>
        </div>
      </div>

      <div class="d-flex justify-content-center">
        <button (click)="onPageChange(1)" [disabled]="currentPage === 1" class="btn btn-pagination"><mat-icon>first_page</mat-icon></button>
        <button (click)="onPageChange(currentPage - 1)" [disabled]="currentPage === 1" class="btn btn-pagination previous-page"><mat-icon>chevron_left</mat-icon></button>
        <ul class="pagination m-0">
          <li (click)="onPageChange(page)" *ngFor="let page of pages" [ngClass]="{'active': page == currentPage}" class="page-item">
            <a class="page-link">{{ page }}</a>
          </li>
        </ul>
        <button (click)="onPageChange(currentPage + 1)" [disabled]="currentPage === totalPages" class="btn btn-pagination next-page"><mat-icon>chevron_right</mat-icon></button>
        <button (click)="onPageChange(totalPages)" [disabled]="currentPage === totalPages" class="btn btn-pagination"><mat-icon>last_page</mat-icon></button>
      </div>
    </div>
  </div>
</div>
